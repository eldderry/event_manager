{% extends "base.html" %}
{% block content %}
<h2>✏️ Редактирование мероприятия</h2>
{% if errors %}
<div class="alert alert-danger">
    <ul class="mb-0">
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
<form method="post" class="mt-3">
    <input type="text" name="title" value="{{ form_data.get('title', event.title) }}" class="form-control mb-2" required>
    <textarea name="description" class="form-control mb-2" rows="3">{{ form_data.get('description', event.description) }}</textarea>
    <input type="date" name="date" value="{{ form_data.get('date', event.date.strftime('%Y-%m-%d')) }}" class="form-control mb-2" required>
    <input type="text" name="location" value="{{ form_data.get('location', event.location) }}" class="form-control mb-2" required>
    <select name="category" class="form-control mb-3">
        <option value="Конференция" {% if form_data.get('category', event.category) == 'Конференция' %}selected{% endif %}>Конференция</option>
        <option value="Встреча" {% if form_data.get('category', event.category) == 'Встреча' %}selected{% endif %}>Встреча</option>
        <option value="Вечеринка" {% if form_data.get('category', event.category) == 'Вечеринка' %}selected{% endif %}>Вечеринка</option>
        <option value="Спорт" {% if form_data.get('category', event.category) == 'Спорт' %}selected{% endif %}>Спорт</option>
    </select>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/events" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
