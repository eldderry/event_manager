{% extends "base.html" %}
{% block content %}
<h2>➕ Новое мероприятие</h2>
{% if errors %}
<div class="alert alert-danger">
    <ul class="mb-0">
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
<form method="post" class="mt-3">
    <input type="text" name="title" placeholder="Название" class="form-control mb-2" required value="{{ form_data.get('title', '') }}">
    
    <textarea name="description" placeholder="Описание" class="form-control mb-2" rows="3">{{ form_data.get('description', '') }}</textarea>
    
    <input type="date" name="date" class="form-control mb-2" required value="{{ form_data.get('date', '') }}">
    <input type="text" name="location" placeholder="Место проведения" class="form-control mb-2" required value="{{ form_data.get('location', '') }}">
    
    <select name="category" class="form-control mb-3">
        <option value="Конференция" {% if form_data.get('category', '') == 'Конференция' %}selected{% endif %}>Конференция</option>
        <option value="Встреча" {% if form_data.get('category', '') == 'Встреча' %}selected{% endif %}>Встреча</option>
        <option value="Вечеринка" {% if form_data.get('category', '') == 'Вечеринка' %}selected{% endif %}>Вечеринка</option>
        <option value="Спорт" {% if form_data.get('category', '') == 'Спорт' %}selected{% endif %}>Спорт</option>
    </select>
    
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="/events" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
